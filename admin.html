<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Administrador | PASIR Escuela</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f3f4f6"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
  <script src="theme.js" defer></script>
  <style>
    :root{--bg:#f3f5f9;--card:#fff;--stroke:#d8dee8;--text:#0f172a;--muted:#64748b;--blue:#38bdf8;--blue2:#2563eb;--shadow:0 18px 40px rgba(15,23,42,.08);--danger:#dc2626;--ok:#16a34a}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100vh}
    .container{width:min(1120px,94vw);margin:0 auto}
    .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0}
    .brand{display:flex;align-items:center;gap:10px;font-weight:900;color:#0f1b55}
    .dot{width:12px;height:12px;border-radius:999px;background:var(--blue)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:14px;border:0;cursor:pointer;font-weight:900}
    .primary{background:linear-gradient(135deg,#38bdf8,#2563eb);color:#fff}
    .secondary{background:#fff;border:1px solid #d8dee8}
    .dangerBtn{background:#fee2e2;color:#b91c1c}
    .hide{display:none!important}
    .card{background:#fff;border-radius:18px;padding:16px;border:1px solid #e5e7eb;margin-top:12px}
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
    .span6{grid-column:span 6}
    .span12{grid-column:span 12}
    .input,select{width:100%;padding:10px;border-radius:10px;border:1px solid #ccc}
    .item{padding:10px;border:1px solid #eee;border-radius:10px;margin:6px 0}
  </style>
</head>
<body>

<header class="container row">
  <div class="brand"><span class="dot"></span>PASIR ESCUELA</div>
</header>

<main class="container">

<!-- LOGIN -->
<section id="loginView" class="card">
  <h2>Login Admin</h2>
  <form id="adminLoginForm">
    <input id="adminEmail" class="input" placeholder="correo">
    <input id="adminPassword" class="input" type="password" placeholder="clave">
    <button class="btn primary">Ingresar</button>
  </form>
</section>

<!-- DASH -->
<section id="dashView" class="hide">

  <div class="grid">

    <div class="card span6">
      <h3>Dar acceso a recursos (MULTI)</h3>

      <input id="resourceEmail" class="input" placeholder="email alumno">

      <!-- MEJORA: MULTI SELECT -->
      <select id="resourceId" class="input" multiple size="6"></select>

      <input id="resourceStart" type="date" class="input">
      <input id="resourceEnd" type="date" class="input">

      <button id="giveResourceBtn" class="btn primary">Guardar accesos</button>
    </div>

  </div>

</section>

</main>

<script>
const API_URL="https://pasir-proxy.vercel.app/api";
let adminToken="";

// LOGIN (simplificado)
document.getElementById("adminLoginForm").addEventListener("submit",async(e)=>{
  e.preventDefault();
  const r=await fetch(API_URL+"?action=adminLogin&email="+adminEmail.value+"&password="+adminPassword.value);
  const d=await r.json();
  if(d.ok){
    adminToken=d.token;
    loginView.classList.add("hide");
    dashView.classList.remove("hide");
  }
});

// MULTI-RESOURCE ACCESS FIX
document.getElementById("giveResourceBtn").addEventListener("click",async()=>{
  const email=document.getElementById("resourceEmail").value;

  const resourceIds=[...document.getElementById("resourceId").selectedOptions].map(o=>o.value);

  const payload={
    email,
    resourceIds,
    startDate:resourceStart.value,
    endDate:resourceEnd.value,
    token:adminToken
  };

  await fetch(API_URL+"?action=adminGiveResourceMulti",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)
  });

  alert("Accesos asignados");
});
</script>

</body>
</html>
