<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instalar SimuPLC Lab | SimuPLC</title>
  <meta name="description" content="Instala SimuPLC Lab en Android, iPhone o Windows." />

  <style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --cyan:#16bde8;
  --cyan2:#0899cf;
  --cyan3:#e8f9ff;
  --navy:#082f49;
  --muted:#5f7d8b;
  --white:#fff;
}
html,body{min-height:100%}
body{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:22px;
  font-family:"Segoe UI",Arial,sans-serif;
  color:var(--navy);
  background:
    radial-gradient(circle at 15% 10%,rgba(22,189,232,.22),transparent 30%),
    radial-gradient(circle at 90% 90%,rgba(8,153,207,.18),transparent 32%),
    linear-gradient(145deg,#f8fdff,#eaf9ff);
}
.simple-page{width:100%;max-width:560px}
.simple-card{
  position:relative;
  overflow:hidden;
  padding:42px 34px 30px;
  border-radius:30px;
  background:rgba(255,255,255,.92);
  border:1px solid rgba(8,153,207,.14);
  box-shadow:0 24px 65px rgba(8,80,110,.15);
  text-align:center;
}
.simple-card:before{
  content:"";
  position:absolute;
  top:0;left:0;right:0;
  height:6px;
  background:linear-gradient(90deg,var(--cyan),var(--cyan2),var(--cyan));
}
.simple-logo{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:112px;
  height:38px;
  padding:0 17px;
  margin-bottom:18px;
  border-radius:12px;
  color:#fff;
  background:linear-gradient(135deg,var(--cyan),var(--cyan2));
  box-shadow:0 9px 22px rgba(8,153,207,.24);
  font-weight:900;
  font-size:1.08rem;
  letter-spacing:-.02em;
}
h1{
  font-size:clamp(2rem,7vw,2.8rem);
  line-height:1;
  letter-spacing:-.05em;
  margin-bottom:9px;
}
.simple-subtitle{
  color:var(--muted);
  font-size:1rem;
  margin-bottom:27px;
}
.device-buttons{display:grid;gap:13px}
.device-btn{
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:16px;
  padding:11px 20px;
  border-radius:18px;
  text-decoration:none;
  color:#fff;
  background:linear-gradient(135deg,var(--cyan),var(--cyan2));
  border:1px solid rgba(255,255,255,.28);
  box-shadow:0 10px 24px rgba(8,153,207,.20);
  font-size:1.12rem;
  font-weight:900;
  transition:transform .16s ease,box-shadow .16s ease;
}
.device-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 15px 30px rgba(8,153,207,.28);
}
.device-btn:active{transform:scale(.985)}
.device-icon{
  width:44px;height:44px;
  flex:0 0 44px;
  display:grid;place-items:center;
  border-radius:13px;
  background:rgba(255,255,255,.18);
  font-size:1.45rem;
}
.device-icon.apple{font-size:1.75rem}
.simple-footer{
  margin-top:24px;
  color:#7a9aa8;
  font-size:.82rem;
  font-weight:700;
}
@media(max-width:520px){
  body{padding:14px}
  .simple-card{padding:34px 18px 24px;border-radius:24px}
  .device-btn{min-height:64px;border-radius:16px}
}
</style>
</head>

<body>
<main class="simple-page">
  <section class="simple-card">
    <div class="simple-logo">SimuPLC</div>
    <h1>Instala SimuPLC</h1>
    <p class="simple-subtitle">Selecciona tu dispositivo</p>

    <div class="device-buttons">
      <a class="device-btn" href="https://play.google.com/store/apps/details?id=com.pasir.simuplc" target="_blank" rel="noopener noreferrer">
        <span class="device-icon">🤖</span>
        <span>Android</span>
      </a>

      <a class="device-btn" href="https://app.escuelapasir.com/instalariphone">
        <span class="device-icon apple"></span>
        <span>iPhone</span>
      </a>

      <a class="device-btn" href="https://app.escuelapasir.com/instalarwindows">
        <span class="device-icon">🪟</span>
        <span>PC o laptop</span>
      </a>
    </div>

    <div class="simple-footer">Escuela PASIR</div>
  </section>
</main>
</body>
</html>
