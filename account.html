<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mi aprendizaje | PASIR Escuela</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" id="theme-color-meta" content="#f3f5f9"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
  <script src="theme.js" defer></script>
  <script>
    document.documentElement.classList.add("auth-checking");
    (function(){
      const token = localStorage.getItem("pasir_token");
      if (!token) { location.replace("login.html"); return; }
      document.documentElement.classList.remove("auth-checking");
      try{ document.documentElement.setAttribute('data-theme', localStorage.getItem('pasir-theme') || 'light'); }catch(e){}
    })();
  </script>
  <style>
    html.auth-checking, html.auth-checking body{visibility:hidden}
    :root{
      --bg:#f3f5f9;--card:#ffffff;--soft:#eef8ff;--stroke:#d8e3f1;--text:#0f172a;--muted:#64748b;
      --blue:#38bdf8;--blue2:#2563eb;--green:#22c55e;--red:#ef4444;--shadow:0 18px 40px rgba(15,23,42,.08)
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100vh}
    .container{width:min(1180px,92vw);margin:0 auto}
    .app-header{background:transparent;border-bottom:none;box-shadow:none}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0 0}
    .brand{display:flex;align-items:center;gap:10px;font-weight:1000;color:#0f1b55;letter-spacing:.02em}
    .dot{width:12px;height:12px;border-radius:999px;background:var(--blue);box-shadow:0 0 0 6px rgba(56,189,248,.14)}
    .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 13px;border-radius:14px;text-decoration:none;font-weight:900;border:1px solid transparent;cursor:pointer;white-space:nowrap}
    .btn.secondary{background:#fff;border-color:rgba(37,99,235,.16);color:#1d4ed8;box-shadow:0 8px 18px rgba(15,23,42,.04)}
    .btn.active{background:linear-gradient(135deg,#38bdf8,#2563eb);color:#fff;border:0;box-shadow:0 12px 22px rgba(37,99,235,.20)}
    .theme-btn{background:#fff;color:var(--text);border:1px solid rgba(37,99,235,.14);box-shadow:0 8px 18px rgba(15,23,42,.05);border-radius:14px;padding:10px 12px}
    .user-menu{position:relative}
    .user-trigger{display:inline-flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;border:1px solid rgba(37,99,235,.14);background:#fff;color:var(--text);font-weight:900;cursor:pointer;box-shadow:0 8px 18px rgba(15,23,42,.04);max-width:220px}
    .user-trigger .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
    .avatar{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;border-radius:999px;background:rgba(56,189,248,.10);border:1px solid rgba(56,189,248,.24)}
    .user-dropdown{z-index:50;position:absolute;right:0;top:calc(100% + 10px);min-width:260px;border:1px solid rgba(37,99,235,.14);background:#fff;border-radius:16px;box-shadow:0 20px 40px rgba(15,23,42,.12);padding:8px;display:none}
    .user-dropdown.open{display:block}.dd-email{padding:10px 12px;color:var(--muted);font-size:13px;word-break:break-all}.dd-item{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;text-decoration:none;border:0;background:transparent;color:inherit;font-weight:900;cursor:pointer;text-align:left}.dd-item:hover{background:rgba(56,189,248,.08)}.dd-sep{height:1px;background:rgba(148,163,184,.18);margin:6px 4px}.danger{color:#dc2626}
    main{padding:24px 0 44px}.hero{background:linear-gradient(135deg,#eef8ff,#ffffff);border:1px solid rgba(37,99,235,.12);border-radius:24px;padding:22px;box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:18px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;color:#1d4ed8;font-weight:900;background:rgba(56,189,248,.10);border:1px solid rgba(56,189,248,.20);border-radius:999px;padding:7px 11px;font-size:13px;margin-bottom:10px}
    h1{font-size:clamp(1.55rem,4vw,2.45rem);line-height:1.03;margin:0;color:#111827;letter-spacing:-.04em}.hero p{margin:8px 0 0;color:var(--muted);font-size:1rem}
    .stats{display:grid;grid-template-columns:repeat(3,minmax(100px,1fr));gap:10px;min-width:320px}.stat{background:#fff;border:1px solid rgba(37,99,235,.12);border-radius:18px;padding:12px 14px;box-shadow:0 8px 18px rgba(15,23,42,.04)}.stat b{display:block;font-size:1.35rem;color:#111827}.stat span{color:var(--muted);font-weight:800;font-size:12px}
    .section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:20px 0 12px}.section-head h2{margin:0;font-size:1.35rem;color:#111827;letter-spacing:-.02em}.muted{color:var(--muted)}
    .course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.course{background:#fff;border:1px solid rgba(37,99,235,.12);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);text-decoration:none;color:inherit;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}.course:hover{transform:translateY(-2px);border-color:rgba(37,99,235,.25);box-shadow:0 22px 48px rgba(15,23,42,.12)}
    .course-cover{display:block;aspect-ratio:16/9;background:#eaf4ff;position:relative}.course-cover img{width:100%;height:100%;object-fit:cover;display:block}.tag{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.9);border:1px solid rgba(37,99,235,.16);color:#1d4ed8;font-weight:1000;border-radius:999px;padding:6px 10px;font-size:12px}
    .course-body{padding:14px}.course-title{margin:0 0 6px;font-weight:1000;font-size:15px;line-height:1.25;color:#111827}.course-sub{margin:0;color:var(--muted);font-size:12px}.progress{margin-top:12px;height:8px;border-radius:999px;background:#e8eef7;overflow:hidden;border:1px solid #dde7f3}.progress>div{height:100%;background:linear-gradient(90deg,#38bdf8,#2563eb)}.progress-meta{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:var(--muted);font-weight:800}.course-actions{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:12px;flex-wrap:wrap}.btn-continue{display:inline-flex;align-items:center;justify-content:center;padding:9px 11px;border-radius:12px;text-decoration:none;font-weight:900;font-size:12px;background:linear-gradient(135deg,#38bdf8,#2563eb);color:#fff}.pill{padding:7px 10px;border-radius:999px;background:rgba(56,189,248,.10);color:#1d4ed8;border:1px solid rgba(56,189,248,.20);font-weight:900;font-size:12px}
    .empty,.err{background:#fff;border:1px solid rgba(37,99,235,.12);border-radius:18px;padding:18px;color:var(--muted);box-shadow:var(--shadow)}.err{color:#dc2626;background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.16);font-weight:800}
    body[data-theme="dark"]{background:#0b1220;color:#f8fafc}body[data-theme="dark"] .brand,body[data-theme="dark"] h1,body[data-theme="dark"] h2,body[data-theme="dark"] .course-title,body[data-theme="dark"] .stat b{color:#f8fafc}body[data-theme="dark"] .muted,body[data-theme="dark"] .hero p,body[data-theme="dark"] .course-sub,body[data-theme="dark"] .progress-meta,body[data-theme="dark"] .stat span{color:#94a3b8}body[data-theme="dark"] .hero{background:linear-gradient(120deg,rgba(15,23,42,.88),rgba(2,6,23,.96))}body[data-theme="dark"] .course,body[data-theme="dark"] .stat,body[data-theme="dark"] .user-trigger,body[data-theme="dark"] .user-dropdown,body[data-theme="dark"] .btn.secondary,body[data-theme="dark"] .theme-btn,body[data-theme="dark"] .empty{background:#0f172a;color:#f8fafc;border-color:rgba(148,163,184,.22)}body[data-theme="dark"] .course-cover{background:#111827}body[data-theme="dark"] .progress{background:#172033;border-color:#22304a}
    @media(max-width:760px){.container{width:min(1180px,94vw)}.topbar{align-items:flex-start}.actions{gap:8px}.btn{padding:9px 10px;font-size:13px}.user-trigger{max-width:142px}.user-trigger .name{max-width:72px}.hero{padding:18px}.stats{grid-template-columns:repeat(3,1fr);min-width:100%;gap:8px}.stat{padding:10px}.stat b{font-size:1.15rem}.course-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.course-body{padding:11px}.course-title{font-size:13.5px}.course-actions{display:block}.btn-continue{width:100%;margin-bottom:8px}.pill{display:inline-flex}}

    /* PASIR PRO LIMPIO: menos espacio en móvil y tarjetas sin textos repetidos */
    .hero{padding:12px 14px;margin-bottom:12px;align-items:center}
    .hero .hero-copy{display:none}
    .stats{min-width:100%;grid-template-columns:repeat(3,1fr)}
    .stat{padding:10px 12px;text-align:center}
    .section-head{display:none}
    .tag{display:none!important}
    .course-sub{display:none!important}
    .progress-meta span:first-child{display:none!important}
    .progress-meta{justify-content:center;margin-top:7px}
    .course-actions{justify-content:center}
    .course-actions .pill{display:none!important}
    .btn-continue{width:100%;font-size:13px}

    .progress-row{display:flex;align-items:center;gap:9px;margin-top:10px}
    .progress-row .progress{flex:1;margin-top:0}
    .progress-num{min-width:38px;text-align:right;font-size:12px;font-weight:1000;color:#1d4ed8}
    body[data-theme="dark"] .progress-num{color:#38bdf8}
    .progress-meta span:first-child{display:inline!important}
    @media(max-width:760px){main{padding-top:12px}.hero{border-radius:18px}.stats{gap:7px}.stat{border-radius:14px;padding:9px 7px}.stat span{font-size:10px}.course-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.progress{margin-top:9px}.user-trigger{max-width:150px}.user-trigger .name{max-width:82px}}
  </style>
</head>
<body>
<header class="app-header"><div class="container"><div class="topbar">
  <div class="brand"><span class="dot"></span><span>PASIR<span style="color:#38bdf8"> ESCUELA 🗲</span></span></div>
  <div class="actions">
    <a class="btn active" href="account.html">Cursos</a>
    <a class="btn secondary" href="recursos.html">Manuales / Apps</a>
    <button class="theme-btn" id="theme-toggle" type="button" aria-label="Cambiar tema"><span id="theme-icon">☀️</span><span id="theme-label" style="display:none">Modo claro</span></button>
    <div class="user-menu" id="userMenu" style="display:none">
      <button class="user-trigger" id="userTrigger" aria-haspopup="menu" aria-expanded="false"><span class="avatar">👤</span><span class="name" id="userName">Cuenta</span><span>▾</span></button>
      <div class="user-dropdown" id="userDropdown" role="menu">
        <div class="dd-email" id="userEmail">Cargando…</div>
        <a class="dd-item" href="account.html">📚 Mis cursos</a>
        <a class="dd-item" href="recursos.html">📥 Manuales y Apps</a>
        <a class="dd-item" href="index.html">🏠 Inicio</a>
        <div class="dd-sep"></div>
        <button class="dd-item danger" id="logout">🚪 Cerrar sesión</button>
      </div>
    </div>
  </div>
</div></div></header>
<main><div class="container">
  <section class="hero">
    <div class="hero-copy"><div class="eyebrow">🎓 Panel del estudiante</div><h1 id="welcomeTitle">Continúa aprendiendo</h1><p>Accede rápido a tus cursos activos y sigue tu progreso desde cualquier dispositivo.</p></div>
    <div class="stats"><div class="stat"><b id="courseCount">0</b><span>Cursos</span></div><div class="stat"><b id="progressAvg">0%</b><span>Avance promedio</span></div><div class="stat"><b id="activeCount">0</b><span>Activos</span></div></div>
  </section>
  <div id="status" class="muted">Cargando…</div>
  <section><div class="section-head"><h2>Tus cursos</h2><span class="muted" id="courseLabel"></span></div><div id="list" class="course-grid"></div></section>
</div></main>
<script>
const API_URL="https://pasir-proxy.vercel.app/api";
const token=localStorage.getItem("pasir_token");
if(!token) location.replace("login.html");
function escapeHtml_(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function jsonp(action,payload){return new Promise((resolve,reject)=>{const cb="cb_"+Math.random().toString(36).slice(2);const params=new URLSearchParams();params.set("action",action);Object.entries(payload||{}).forEach(([k,v])=>{if(v!==undefined&&v!==null)params.set(k,String(v));});params.set("callback",cb);const script=document.createElement("script");script.src=API_URL+"?"+params.toString();script.async=true;window[cb]=data=>{cleanup();resolve(data)};function cleanup(){try{delete window[cb]}catch(e){window[cb]=undefined} if(script.parentNode)script.parentNode.removeChild(script)}script.onerror=()=>{cleanup();reject(new Error("Sin conexión a internet."));};document.body.appendChild(script);});}
function loadCourseProgress(courseId){try{return JSON.parse(localStorage.getItem("pasir_progress_"+courseId)||"{}");}catch(e){return {};}}
function getCourseProgress(courseId,apiProgress){const p=loadCourseProgress(courseId);const completed=Array.isArray(p.completed)?p.completed.length:0;const total=Number(p.totalModules||0);const localPercent=total>0?Math.round((completed/total)*100):0;const percent=localPercent>0?localPercent:(Number.isFinite(apiProgress)?apiProgress:0);return{percent,completed,total};}
function continueHref(courseId){return "course.html?courseId="+encodeURIComponent(courseId);}
function shortEmail(email){email=String(email||"");return email.includes("@")?email.split("@")[0]:email;}
function titleCaseName(name){const parts=String(name||"").trim().replace(/\s+/g," ").split(" ").filter(Boolean);if(!parts.length)return "";const cap=w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase();return parts.length===1?cap(parts[0]):cap(parts[0])+" "+parts[1].charAt(0).toUpperCase()+".";}
function getDisplayName(profile){
  const email=typeof profile==="object"?(profile.email||""):String(profile||"");
  const rawName=typeof profile==="object"?(profile.name||profile.fullName||profile.displayName||profile.nombre||profile.nombres||profile.studentName||profile.usuario||""):(!String(profile||"").includes("@")?profile:"");
  const savedName=localStorage.getItem("pasir_name")||"";
  return titleCaseName(rawName)||titleCaseName(savedName)||shortEmail(email);
}
function setUser(profile){
  const email=typeof profile==="object"?(profile.email||""):String(profile||"");
  const displayName=getDisplayName(profile);
  if(email)localStorage.setItem("pasir_email",email);
  if(displayName && displayName!==shortEmail(email))localStorage.setItem("pasir_name",displayName);
  document.getElementById("userName").textContent=displayName||"Cuenta";
  document.getElementById("userEmail").textContent=email||displayName||"Cuenta";
  document.getElementById("welcomeTitle").textContent="Continúa aprendiendo";
  document.getElementById("userMenu").style.display="inline-block";
}
function courseCard(c){const img=c.imageUrl||`assets/courses/${encodeURIComponent(c.courseId)}.jpg`;const pRaw=(c.progress??c.progreso);const pNum=typeof pRaw==="number"?pRaw:(typeof pRaw==="string"?parseFloat(pRaw):NaN);const apiProgress=Number.isFinite(pNum)?Math.max(0,Math.min(100,pNum)):0;const saved=getCourseProgress(c.courseId,apiProgress);const progress=saved.percent;const continueText=progress>0?"Continuar":"Empezar";const moduleText=saved.total?`${saved.completed}/${saved.total} módulos`:(progress>0?"En progreso":"Sin iniciar");return `<article class="course"><a class="course-cover" href="${continueHref(c.courseId)}"><img src="${escapeHtml_(img)}" alt="${escapeHtml_(c.title)}" onerror="this.onerror=null;this.src='icons/icon-512.png';"></a><div class="course-body"><p class="course-title">${escapeHtml_(c.title)}</p><div class="progress-row"><div class="progress"><div style="width:${progress}%"></div></div><span class="progress-num">${progress}%</span></div><div class="progress-meta"><span>${moduleText}</span></div><div class="course-actions"><a class="btn-continue" href="${continueHref(c.courseId)}">▶ ${continueText}</a></div></div></article>`;}
const ACCOUNT_CACHE_KEY="pasir_cache_account_v2";
const CACHE_MAX_AGE=1000*60*10;
function readCache(key){try{return JSON.parse(localStorage.getItem(key)||"null");}catch(e){return null;}}
function writeCache(key,data){try{localStorage.setItem(key,JSON.stringify({savedAt:Date.now(),data}));}catch(e){}}
function renderAccount(r,fromCache){
  const email=r.email||localStorage.getItem("pasir_email")||"";
  setUser({email,name:r.name||r.fullName||r.displayName||r.nombre||r.nombres||r.studentName||r.usuario||localStorage.getItem("pasir_name")||""});
  const courses=Array.isArray(r.courses)?r.courses:[];
  document.getElementById("status").textContent=fromCache?"":"";
  document.getElementById("courseCount").textContent=courses.length;
  document.getElementById("activeCount").textContent=courses.filter(c=>!c.expired).length;
  document.getElementById("courseLabel").textContent=courses.length?courses.length+" curso(s) disponible(s)":"";
  if(!courses.length){document.getElementById("progressAvg").textContent="0%";document.getElementById("list").innerHTML='<div class="empty">Aún no tienes cursos habilitados. Si ya pagaste, espera a que lo activen por WhatsApp.</div>';return;}
  let sum=0;courses.forEach(c=>{const pRaw=(c.progress??c.progreso);const pNum=typeof pRaw==="number"?pRaw:(typeof pRaw==="string"?parseFloat(pRaw):NaN);sum+=getCourseProgress(c.courseId,Number.isFinite(pNum)?pNum:0).percent;});
  document.getElementById("progressAvg").textContent=Math.round(sum/courses.length)+"%";
  document.getElementById("list").innerHTML=courses.map(courseCard).join("");
}
function renderCourseSkeleton(){document.getElementById("status").textContent="Cargando…";document.getElementById("list").innerHTML=Array.from({length:4}).map(()=>`<article class="course"><div class="course-cover"></div><div class="course-body"><p class="course-title">Cargando curso…</p><div class="progress-row"><div class="progress"><div style="width:35%"></div></div><span class="progress-num">...</span></div><div class="progress-meta"><span>Preparando</span></div><div class="course-actions"><span class="btn-continue">Cargando</span></div></div></article>`).join("");}
async function refreshAccount(silent){
  try{const r=await jsonp("me",{token});if(!r.ok){localStorage.removeItem("pasir_token");return location.replace("login.html");}writeCache(ACCOUNT_CACHE_KEY,r);renderAccount(r,false);}catch(e){if(!silent)document.getElementById("status").innerHTML='<div class="err">'+escapeHtml_(e.message||e)+'</div>';else document.getElementById("status").textContent="";}
}
(function(){const cached=readCache(ACCOUNT_CACHE_KEY);if(cached&&cached.data){renderAccount(cached.data,true);refreshAccount(true);}else{renderCourseSkeleton();refreshAccount(false);}})();
(function(){const userMenu=document.getElementById("userMenu"),userTrigger=document.getElementById("userTrigger"),userDropdown=document.getElementById("userDropdown");const storedEmail=localStorage.getItem("pasir_email")||"";const storedName=localStorage.getItem("pasir_name")||"";if(storedEmail||storedName)setUser({email:storedEmail,name:storedName});function closeMenu(){userDropdown&&userDropdown.classList.remove("open");userTrigger&&userTrigger.setAttribute("aria-expanded","false");}if(userTrigger&&userDropdown){userTrigger.addEventListener("click",e=>{e.stopPropagation();userDropdown.classList.toggle("open");userTrigger.setAttribute("aria-expanded",userDropdown.classList.contains("open")?"true":"false");});document.addEventListener("click",closeMenu);document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu();});userDropdown.addEventListener("click",e=>e.stopPropagation());}const logoutBtn=document.getElementById("logout");if(logoutBtn)logoutBtn.addEventListener("click",e=>{e.preventDefault();localStorage.removeItem("pasir_token");localStorage.removeItem("pasir_name");localStorage.removeItem("pasir_email");location.replace("index.html");});})();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
</script>
</body>
</html>
