<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Aula en vivo por Zoom | PASIR Escuela</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f3f5f9"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
  <script src="theme.js" defer></script>
  <style>
    :root{--bg:#f3f5f9;--card:#ffffff;--stroke:#d8e3f1;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--sky:#38bdf8;--red:#ef4444;--shadow:0 18px 40px rgba(15,23,42,.08)}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100vh}
    .container{width:min(1100px,92vw);margin:0 auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0}.brand{display:flex;align-items:center;gap:10px;font-weight:1000;color:#0f1b55;text-decoration:none}.dot{width:12px;height:12px;border-radius:999px;background:var(--sky);box-shadow:0 0 0 6px rgba(56,189,248,.14)}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 13px;border-radius:14px;text-decoration:none;font-weight:900;border:1px solid rgba(37,99,235,.16);cursor:pointer;background:#fff;color:#1d4ed8}.btn.primary{background:linear-gradient(135deg,#ef4444,#2563eb);color:#fff;border:0}.hero{background:linear-gradient(135deg,#fff,#eef8ff);border:1px solid rgba(37,99,235,.12);border-radius:24px;padding:22px;box-shadow:var(--shadow);display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:center;margin-bottom:18px}.eyebrow{display:inline-flex;align-items:center;gap:8px;color:#1d4ed8;font-weight:900;background:rgba(56,189,248,.10);border:1px solid rgba(56,189,248,.20);border-radius:999px;padding:7px 11px;font-size:13px;margin-bottom:10px}h1{font-size:clamp(1.7rem,4vw,2.6rem);line-height:1.03;margin:0;color:#111827;letter-spacing:-.04em}.hero p{margin:8px 0 0;color:var(--muted);font-size:1rem}.hero-card{border-radius:22px;overflow:hidden;border:1px solid rgba(37,99,235,.14);background:#0f172a;min-height:180px;position:relative}.hero-card img{width:100%;height:100%;object-fit:cover;display:block;opacity:.82}.live-dot{position:absolute;left:14px;top:14px;background:rgba(239,68,68,.95);color:#fff;border-radius:999px;padding:7px 11px;font-weight:1000;font-size:12px}.session{background:#fff;border:1px solid rgba(37,99,235,.12);border-radius:22px;box-shadow:var(--shadow);padding:18px}.session h2{margin:0 0 8px;font-size:1.2rem}.meta{display:grid;gap:8px;margin:12px 0}.meta-row{display:flex;gap:8px;color:#334155}.meta-row b{min-width:90px;color:#0f172a}.message{background:#f0f7ff;border:1px solid rgba(37,99,235,.12);border-radius:16px;padding:12px;color:#334155;line-height:1.45}.session-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.empty,.err,.loading{background:#fff;border:1px solid rgba(37,99,235,.12);border-radius:20px;padding:18px;color:var(--muted);box-shadow:var(--shadow);line-height:1.45}.err{color:#dc2626;background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.16);font-weight:800}.note{margin-top:12px;color:var(--muted);font-size:13px}.course-chip{display:inline-flex;margin-bottom:10px;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:rgba(56,189,248,.10);border:1px solid rgba(56,189,248,.20);color:#1d4ed8;font-size:12px;font-weight:1000}
    body[data-theme="dark"]{background:#0b1220;color:#f8fafc}body[data-theme="dark"] .brand,body[data-theme="dark"] h1,body[data-theme="dark"] .session h2,body[data-theme="dark"] .meta-row b{color:#f8fafc}body[data-theme="dark"] .hero{background:linear-gradient(120deg,rgba(15,23,42,.88),rgba(2,6,23,.96));border-color:rgba(148,163,184,.22)}body[data-theme="dark"] .session,body[data-theme="dark"] .empty,body[data-theme="dark"] .loading,body[data-theme="dark"] .btn{background:#0f172a;color:#f8fafc;border-color:rgba(148,163,184,.22)}body[data-theme="dark"] .hero p,body[data-theme="dark"] .meta-row,body[data-theme="dark"] .note{color:#94a3b8}body[data-theme="dark"] .message{background:rgba(56,189,248,.08);border-color:rgba(56,189,248,.16);color:#cbd5e1}
    @media(max-width:760px){.container{width:min(1100px,94vw)}.hero{grid-template-columns:1fr;padding:18px;border-radius:20px}.actions{width:100%}.actions .btn{flex:1}.session-actions .btn{width:100%}.meta-row{display:block}.meta-row b{display:block;margin-bottom:3px}}
  </style>
</head>
<body>
<header class="app-header"><div class="container"><div class="topbar">
  <a class="brand" href="account.html"><span class="dot"></span><span>PASIR<span style="color:#38bdf8"> ESCUELA 🗲</span></span></a>
  <div class="actions"><a class="btn" href="account.html">← Mis cursos</a><a class="btn" href="recursos.html">Recursos</a></div>
</div></div></header>
<main><div class="container">
  <section class="hero">
    <div><div class="eyebrow">🔴 Aula mensual en vivo</div><h1>Aula en vivo por Zoom</h1><p>Esta sección se activa por correo y fecha, igual que tus demás cursos.</p></div>
    <div class="hero-card"><span class="live-dot">ZOOM EN VIVO</span><img src="img/curso_en_vivo_electricidad_industrial.jpg" alt="Aula en vivo por Zoom" onerror="this.onerror=null;this.src='icons/icon-512.png';"></div>
  </section>
  <div id="status" class="loading">Cargando tu sesión…</div>
  <section id="sessions" aria-live="polite"></section>
</div></main>
<script>
const API_URL="https://pasir-proxy.vercel.app/api";
const token=localStorage.getItem("pasir_token");
if(!token) location.replace("login.html");
function escapeHtml_(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function jsonp(action,payload){return new Promise((resolve,reject)=>{const cb="cb_"+Math.random().toString(36).slice(2);const params=new URLSearchParams();params.set("action",action);Object.entries(payload||{}).forEach(([k,v])=>{if(v!==undefined&&v!==null)params.set(k,String(v));});params.set("callback",cb);const script=document.createElement("script");script.src=API_URL+"?"+params.toString();script.async=true;window[cb]=data=>{cleanup();resolve(data)};function cleanup(){try{delete window[cb]}catch(e){window[cb]=undefined} if(script.parentNode)script.parentNode.removeChild(script)}script.onerror=()=>{cleanup();reject(new Error("Sin conexión a internet."));};document.body.appendChild(script);});}
function formatDate(fecha){if(!fecha)return "Por confirmar";const parts=String(fecha).split(/[-\/]/).map(Number);let d;if(parts.length>=3&&String(fecha).includes("-"))d=new Date(parts[0],parts[1]-1,parts[2]);else d=new Date(fecha);if(isNaN(d.getTime()))return fecha;return d.toLocaleDateString("es-PE",{weekday:"long",year:"numeric",month:"long",day:"numeric"});}
function calendarUrl(s){if(!s.fecha)return "";const date=String(s.fecha).replaceAll("/","-");const time=String(s.hora||"20:00").padEnd(5,"0");const start=new Date(`${date}T${time}:00`);if(isNaN(start.getTime()))return "";const end=new Date(start.getTime()+(Number(s.duracion||120)*60000));const fmt=d=>d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}Z$/,"Z");const params=new URLSearchParams();params.set("action","TEMPLATE");params.set("text",`PASIR - ${s.titulo||"Clase en vivo"}`);params.set("dates",`${fmt(start)}/${fmt(end)}`);params.set("details",`${s.mensaje||"Clase mensual en vivo."}${s.enlace?"\n\nEnlace Zoom: "+s.enlace:""}`);params.set("location",s.enlace||"Zoom");return "https://calendar.google.com/calendar/render?"+params.toString();}
function sessionCard(s){const cal=calendarUrl(s);return `<article class="session"><span class="course-chip">🎓 ${escapeHtml_(s.curso||"Aula en vivo")}</span><h2>${escapeHtml_(s.titulo||"Clase mensual en vivo")}</h2><div class="meta"><div class="meta-row"><b>Fecha:</b><span>${escapeHtml_(formatDate(s.fecha))}</span></div><div class="meta-row"><b>Hora:</b><span>${escapeHtml_(s.hora||"Por confirmar")}</span></div><div class="meta-row"><b>Duración:</b><span>${escapeHtml_(s.duracion||120)} minutos</span></div></div><div class="message">${escapeHtml_(s.mensaje||"Cuando llegue la fecha, entra desde este botón.")}</div><div class="session-actions">${s.enlace?`<a class="btn primary" href="${escapeHtml_(s.enlace)}" target="_blank" rel="noopener">Entrar a Zoom</a>`:`<span class="btn">Enlace por confirmar</span>`}${cal?`<a class="btn" href="${escapeHtml_(cal)}" target="_blank" rel="noopener">Agregar a Google Calendar</a>`:""}</div></article>`;}
async function loadZoom(){const status=document.getElementById("status");try{const r=await jsonp("zoomSession",{token});status.textContent="";if(!r.ok){document.getElementById("sessions").innerHTML=`<div class="empty">${escapeHtml_(r.error||"No tienes acceso al aula en vivo.")}<p class="note">Si ya compraste, espera a que el administrador te active el acceso.</p></div>`;return;}if(!r.session){document.getElementById("sessions").innerHTML='<div class="empty">Todavía no hay una sesión mensual programada. Cuando el administrador agregue la fecha y el enlace de Zoom, aparecerá aquí automáticamente.</div>';return;}document.getElementById("sessions").innerHTML=sessionCard(r.session);}catch(e){status.innerHTML='<div class="err">'+escapeHtml_(e.message||e)+'</div>';}}
loadZoom();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
</script>
</body>
</html>
