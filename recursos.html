<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Recursos PASIR - Visor PDF</title>
<style>
body{margin:0;font-family:Arial;background:#0b1220;color:#fff}
header{padding:12px;background:#111827;display:flex;justify-content:space-between;align-items:center}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}
.card{background:#1f2937;border-radius:12px;padding:10px;cursor:pointer}
.card:hover{background:#374151}
#viewer{position:fixed;inset:0;display:none;flex-direction:column;background:#000}
#viewer iframe{flex:1;width:100%;border:none}
.btn{padding:8px 12px;background:#2563eb;border:none;color:#fff;border-radius:8px;cursor:pointer}
</style>
</head>
<body>

<header>
<div>📚 PASIR VISOR PDF</div>
<button class="btn" onclick="closeViewer()">Cerrar</button>
</header>

<div class="grid">
<div class="card" onclick="openPDF('https://escuelapasir.com/pdfs/plcbasico.pdf')">
📘 PLC Básico
</div>
</div>

<div id="viewer">
<iframe id="frame"></iframe>
</div>

<script>
function openPDF(url){
  document.getElementById('viewer').style.display='flex';
  document.getElementById('frame').src=url;
}
function closeViewer(){
  document.getElementById('viewer').style.display='none';
  document.getElementById('frame').src='';
}
</script>

</body>
</html>
