<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Manuales y Apps | PASIR Escuela</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" id="theme-color-meta" content="#f3f4f6"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
  <script src="theme.js" defer></script>
  <script>
    document.documentElement.classList.add("auth-checking");
    (function(){
      const token = localStorage.getItem("pasir_token");
      if (!token) {
        location.replace("login.html");
        return;
      }
      document.documentElement.classList.remove("auth-checking");
    })();
  </script>
  <style>
    html.auth-checking, html.auth-checking body{visibility:hidden}
    :root{
      --pasir-bg:#f3f5f9;
      --pasir-card:#ffffff;
      --pasir-stroke:#d8dee8;
      --pasir-text:#0f172a;
      --pasir-muted:#64748b;
      --pasir-blue:#38bdf8;
      --pasir-blue-dark:#2563eb;
      --pasir-shadow:0 18px 40px rgba(15,23,42,.08);
    }
    body{
      margin:0;
      background:var(--pasir-bg);
      color:var(--pasir-text);
      font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
      min-height:100vh;
    }
    .app-header{background:transparent;border-bottom:none;box-shadow:none}
    .container{width:min(1100px,92vw);margin:0 auto}
    .row{display:flex;justify-content:space-between;align-items:center;padding:18px 0 0;gap:12px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:900;color:#0f1b55}
    .dot{width:12px;height:12px;border-radius:999px;background:var(--pasir-blue);box-shadow:0 0 0 6px rgba(56,189,248,.14)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 12px;border-radius:12px;text-decoration:none;font-weight:900;border:0;cursor:pointer}
    .secondary{background:#fff;border:1px solid rgba(37,99,235,.16);color:#1d4ed8;box-shadow:0 8px 18px rgba(15,23,42,.04)}
    .primary{background:linear-gradient(135deg,#38bdf8,#2563eb);color:#fff;border:none}
    .disabled{background:#e5e7eb !important;color:#64748b !important;pointer-events:none;border:1px solid #d1d5db !important}
    .theme-btn{background:#fff;color:var(--pasir-text);border:1px solid rgba(37,99,235,.14);box-shadow:0 8px 18px rgba(15,23,42,.05)}
    main{padding:22px 0 42px}
    .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
    .title{font-size:2rem;line-height:1.05;font-weight:900;letter-spacing:-.03em;margin:0;color:#111827}
    .muted{color:var(--pasir-muted)}
    .hero{background:linear-gradient(135deg,#eef8ff,#ffffff);border:1px solid rgba(37,99,235,.12);border-radius:20px;padding:22px 20px;box-shadow:var(--pasir-shadow);margin-bottom:18px}
    .hero h1{margin:0 0 6px;font-size:1.9rem;letter-spacing:-.03em;color:#111827}
    .hero p{margin:0;color:var(--pasir-muted)}
    .section{margin-top:22px}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}
    .section h2{margin:0;font-size:1.2rem;color:#111827}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
    .card{background:#fff;border:1px solid rgba(37,99,235,.12);border-radius:18px;overflow:hidden;box-shadow:var(--pasir-shadow)}
    .thumb{aspect-ratio:16/9;background:#eaf4ff;position:relative}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .badge{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.88);border:1px solid rgba(37,99,235,.16);color:#1d4ed8;font-weight:900;border-radius:999px;padding:6px 10px;font-size:12px}
    .body{padding:14px 14px 16px;background:#fff}
    .card h3{margin:0 0 6px;color:#111827;font-size:15px;line-height:1.25}
    .desc{margin:0 0 12px;color:var(--pasir-muted);font-size:13px;min-height:34px}
    .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
    .pill{background:rgba(56,189,248,.10);color:#1d4ed8;border:1px solid rgba(56,189,248,.20);border-radius:999px;padding:6px 10px;font-weight:900;font-size:12px}
    .pill.expired{background:rgba(239,68,68,.08);color:#dc2626;border-color:rgba(239,68,68,.18)}
    .err{color:#dc2626;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.16);border-radius:12px;padding:12px;font-weight:800}
    .empty{background:#fff;border:1px solid rgba(37,99,235,.12);border-radius:16px;padding:16px;color:var(--pasir-muted)}
    .user-menu{position:relative}
    .user-trigger{display:inline-flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;border:1px solid rgba(37,99,235,.14);background:#fff;color:var(--pasir-text);font-weight:900;cursor:pointer;box-shadow:0 8px 18px rgba(15,23,42,.04)}
    .avatar{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;border-radius:999px;background:rgba(56,189,248,.10);border:1px solid rgba(56,189,248,.24)}
    .user-dropdown{z-index:50;position:absolute;right:0;top:calc(100% + 10px);min-width:220px;border:1px solid rgba(37,99,235,.14);background:#fff;border-radius:14px;box-shadow:0 20px 40px rgba(15,23,42,.10);padding:8px;display:none}
    .user-dropdown.open{display:block}
    .dd-item{width:100%;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;text-decoration:none;border:0;background:transparent;color:inherit;font-weight:900;cursor:pointer;text-align:left}
    .dd-item:hover{background:rgba(56,189,248,.08)}
    .dd-sep{height:1px;background:rgba(148,163,184,.18);margin:6px 4px}.danger{color:#dc2626}
    html[data-theme="dark"] body, body[data-theme="dark"]{background:#0b1220;color:#f9fafb}
    body[data-theme="dark"] .brand, body[data-theme="dark"] .title, body[data-theme="dark"] h1, body[data-theme="dark"] h2, body[data-theme="dark"] h3{color:#f8fafc}
    body[data-theme="dark"] .muted, body[data-theme="dark"] .desc{color:#94a3b8}
    body[data-theme="dark"] .hero{background:linear-gradient(120deg,rgba(15,23,42,.88),rgba(2,6,23,.96))}
    body[data-theme="dark"] .card, body[data-theme="dark"] .body, body[data-theme="dark"] .empty, body[data-theme="dark"] .theme-btn, body[data-theme="dark"] .secondary, body[data-theme="dark"] .user-trigger, body[data-theme="dark"] .user-dropdown{background:#0f172a;color:#f8fafc;border-color:rgba(148,163,184,.22)}
    body[data-theme="dark"] .thumb{background:#111827}
    @media (max-width:700px){.container{width:min(1100px,94vw)}.title{font-size:1.65rem}.hero h1{font-size:1.55rem}.grid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}}
  </style>
</head>
<body>
  <header class="app-header">
    <div class="container">
      <div class="row">
        <div class="brand"><span class="dot"></span><span>PASIR<span style="color:#38bdf8"> ESCUELA 🗲</span></span></div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <button class="btn theme-btn" id="theme-toggle" type="button" aria-label="Cambiar tema"><span id="theme-icon">☀️</span><span id="theme-label" style="display:none">Modo claro</span></button>
        </div>
      </div>
    </div>
  </header>

  <main><div class="container">
    <div class="top">
      <div>
        <h1 class="title">Manuales y Apps</h1>
        <div class="muted">Aquí verás solo los recursos habilitados para tu correo.</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <a class="btn secondary" href="account.html">Mis cursos</a>
        <a class="btn secondary" href="index.html">Volver</a>
        <div class="user-menu" id="userMenu" style="display:none;">
          <button class="user-trigger" id="userTrigger" aria-haspopup="menu" aria-expanded="false"><span class="avatar">👤</span><span id="userName">Cargando…</span><span>▾</span></button>
          <div class="user-dropdown" id="userDropdown" role="menu">
            <a class="dd-item" href="account.html" role="menuitem">📚 Mis cursos</a>
            <a class="dd-item" href="recursos.html" role="menuitem">📥 Manuales y Apps</a>
            <div class="dd-sep"></div>
            <button class="dd-item danger" id="logout" role="menuitem">🚪 Cerrar sesión</button>
          </div>
        </div>
      </div>
    </div>

    <div id="status" class="muted">Cargando…</div>
    <div class="hero"><h1>Biblioteca de recursos</h1><p>Descarga manuales y aplicaciones autorizadas para tu cuenta.</p></div>

    <section class="section">
      <div class="section-head"><h2>📚 Manuales</h2><span class="muted" id="manualCount"></span></div>
      <div id="manuales" class="grid"></div>
    </section>

    <section class="section">
      <div class="section-head"><h2>🖥️ Apps</h2><span class="muted" id="appCount"></span></div>
      <div id="apps" class="grid"></div>
    </section>
  </div></main>

<script>
const API_URL = "https://pasir-proxy.vercel.app/api";
const token = localStorage.getItem("pasir_token");
if (!token) location.replace("login.html");

function escapeHtml_(s){return String(s||"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function jsonp(action, payload){
  return new Promise((resolve,reject)=>{
    const cb="cb_"+Math.random().toString(36).slice(2);
    const params=new URLSearchParams();
    params.set("action",action);
    Object.entries(payload||{}).forEach(([k,v])=>{if(v!==undefined&&v!==null)params.set(k,String(v));});
    params.set("callback",cb);
    const script=document.createElement("script");
    script.src=API_URL+"?"+params.toString();
    script.async=true;
    window[cb]=(data)=>{cleanup();resolve(data)};
    function cleanup(){try{delete window[cb]}catch(e){window[cb]=undefined} if(script.parentNode)script.parentNode.removeChild(script)}
    script.onerror=()=>{cleanup();reject(new Error("Sin conexión a internet."));};
    document.body.appendChild(script);
  });
}
function normalizeType(t){
  t=String(t||"").trim().toLowerCase();
  if(t.includes("app") || t.includes("software")) return "app";
  return "manual";
}
function card(r){
  const type=normalizeType(r.type);
  const img=r.image || (type==="app" ? "img/app_logicsoft.jpg" : "img/manual_industrial.jpg");
  const expired=!!r.expired;
  const statusText=expired ? "Vencido" : "Activo";
  const btn=expired
    ? `<span class="btn disabled">Acceso vencido</span>`
    : `<a class="btn primary" href="${escapeHtml_(r.link)}" target="_blank" rel="noopener">Descargar</a>`;
  const fecha=r.endDate ? `Vence: ${escapeHtml_(r.endDate)}` : "Acceso ilimitado";
  return `<article class="card">
    <div class="thumb"><img src="${escapeHtml_(img)}" alt="${escapeHtml_(r.title)}" onerror="this.onerror=null;this.src='icons/icon-512.png';"><span class="badge">${type==="app"?"APP":"MANUAL"}</span></div>
    <div class="body">
      <h3>${escapeHtml_(r.title)}</h3>
      <p class="desc">${escapeHtml_(r.description || "Recurso disponible para tu cuenta.")}</p>
      <div class="meta"><span class="pill ${expired?"expired":""}">${statusText}</span><span class="pill">${fecha}</span></div>
      ${btn}
    </div>
  </article>`;
}
function renderEmpty(el,msg){el.innerHTML=`<div class="empty">${msg}</div>`;}
(async function(){
  try{
    const r=await jsonp("myResources",{token});
    if(!r.ok){
      localStorage.removeItem("pasir_token");
      return location.replace("login.html");
    }
    const resources=Array.isArray(r.resources)?r.resources:[];
    document.getElementById("status").textContent="";
    const manuals=resources.filter(x=>normalizeType(x.type)==="manual");
    const apps=resources.filter(x=>normalizeType(x.type)==="app");
    document.getElementById("manualCount").textContent=manuals.length ? manuals.length+" recurso(s)" : "";
    document.getElementById("appCount").textContent=apps.length ? apps.length+" recurso(s)" : "";
    const mEl=document.getElementById("manuales");
    const aEl=document.getElementById("apps");
    if(manuals.length) mEl.innerHTML=manuals.map(card).join(""); else renderEmpty(mEl,"No tienes manuales habilitados todavía.");
    if(apps.length) aEl.innerHTML=apps.map(card).join(""); else renderEmpty(aEl,"No tienes apps habilitadas todavía.");
    const email=r.email || localStorage.getItem("pasir_email") || "";
    if(email){localStorage.setItem("pasir_email",email); const u=document.getElementById("userName"); if(u)u.textContent=email;}
  }catch(e){
    document.getElementById("status").innerHTML='<div class="err">'+escapeHtml_(e.message || e)+'</div>';
  }
})();

(function(){
  const userMenu=document.getElementById("userMenu"), userTrigger=document.getElementById("userTrigger"), userDropdown=document.getElementById("userDropdown"), userNameEl=document.getElementById("userName");
  const stored=localStorage.getItem("pasir_email") || localStorage.getItem("pasir_name");
  if(stored && userNameEl) userNameEl.textContent=stored;
  if(token && userMenu) userMenu.style.display="inline-block";
  function closeMenu(){if(userDropdown){userDropdown.classList.remove("open"); userTrigger && userTrigger.setAttribute("aria-expanded","false");}}
  if(userTrigger && userDropdown){
    userTrigger.addEventListener("click",e=>{e.stopPropagation(); userDropdown.classList.contains("open")?closeMenu():(userDropdown.classList.add("open"), userTrigger.setAttribute("aria-expanded","true"));});
    document.addEventListener("click",closeMenu);
    document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu();});
    userDropdown.addEventListener("click",e=>e.stopPropagation());
  }
  const logoutBtn=document.getElementById("logout");
  if(logoutBtn) logoutBtn.addEventListener("click",e=>{e.preventDefault(); localStorage.removeItem("pasir_token"); localStorage.removeItem("pasir_name"); localStorage.removeItem("pasir_email"); location.replace("index.html");});
})();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
</script>
</body>
</html>
