<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Manuales y Apps | PASIR Escuela</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" id="theme-color-meta" content="#f3f5f9"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
  <script src="theme.js" defer></script>
  <script>
    document.documentElement.classList.add("auth-checking");
    (function(){
      const token = localStorage.getItem("pasir_token");
      if (!token) { location.replace("login.html"); return; }
      document.documentElement.classList.remove("auth-checking");
      try{ document.documentElement.setAttribute('data-theme', localStorage.getItem('pasir-theme') || 'light'); }catch(e){}
    })();
  </script>
  <style>
    html.auth-checking, html.auth-checking body{visibility:hidden}
    :root{--bg:#f3f5f9;--card:#fff;--stroke:#d8e3f1;--text:#0f172a;--muted:#64748b;--blue:#38bdf8;--blue2:#2563eb;--shadow:0 18px 40px rgba(15,23,42,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100vh}.container{width:min(1180px,92vw);margin:0 auto}.app-header{background:transparent;border-bottom:none;box-shadow:none}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0 0}.brand{display:flex;align-items:center;gap:10px;font-weight:1000;color:#0f1b55;letter-spacing:.02em}.dot{width:12px;height:12px;border-radius:999px;background:var(--blue);box-shadow:0 0 0 6px rgba(56,189,248,.14)}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 13px;border-radius:14px;text-decoration:none;font-weight:900;border:1px solid transparent;cursor:pointer;white-space:nowrap}.btn.secondary{background:#fff;border-color:rgba(37,99,235,.16);color:#1d4ed8;box-shadow:0 8px 18px rgba(15,23,42,.04)}.btn.active,.primary{background:linear-gradient(135deg,#38bdf8,#2563eb);color:#fff;border:0;box-shadow:0 12px 22px rgba(37,99,235,.20)}.theme-btn{background:#fff;color:var(--text);border:1px solid rgba(37,99,235,.14);box-shadow:0 8px 18px rgba(15,23,42,.05);border-radius:14px;padding:10px 12px}.disabled{background:#e5e7eb!important;color:#64748b!important;pointer-events:none;border:1px solid #d1d5db!important;box-shadow:none!important}
    .user-menu{position:relative}.user-trigger{display:inline-flex;align-items:center;gap:8px;padding:10px 12px;border-radius:14px;border:1px solid rgba(37,99,235,.14);background:#fff;color:var(--text);font-weight:900;cursor:pointer;box-shadow:0 8px 18px rgba(15,23,42,.04);max-width:220px}.user-trigger .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}.avatar{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;border-radius:999px;background:rgba(56,189,248,.10);border:1px solid rgba(56,189,248,.24)}.user-dropdown{z-index:50;position:absolute;right:0;top:calc(100% + 10px);min-width:260px;border:1px solid rgba(37,99,235,.14);background:#fff;border-radius:16px;box-shadow:0 20px 40px rgba(15,23,42,.12);padding:8px;display:none}.user-dropdown.open{display:block}.dd-email{padding:10px 12px;color:var(--muted);font-size:13px;word-break:break-all}.dd-item{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;text-decoration:none;border:0;background:transparent;color:inherit;font-weight:900;cursor:pointer;text-align:left}.dd-item:hover{background:rgba(56,189,248,.08)}.dd-sep{height:1px;background:rgba(148,163,184,.18);margin:6px 4px}.danger{color:#dc2626}
    main{padding:24px 0 44px}.hero{background:linear-gradient(135deg,#eef8ff,#ffffff);border:1px solid rgba(37,99,235,.12);border-radius:24px;padding:22px;box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:18px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}.eyebrow{display:inline-flex;align-items:center;gap:8px;color:#1d4ed8;font-weight:900;background:rgba(56,189,248,.10);border:1px solid rgba(56,189,248,.20);border-radius:999px;padding:7px 11px;font-size:13px;margin-bottom:10px}h1{font-size:clamp(1.55rem,4vw,2.45rem);line-height:1.03;margin:0;color:#111827;letter-spacing:-.04em}.hero p{margin:8px 0 0;color:var(--muted);font-size:1rem}.stats{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:10px;min-width:260px}.stat{background:#fff;border:1px solid rgba(37,99,235,.12);border-radius:18px;padding:12px 14px;box-shadow:0 8px 18px rgba(15,23,42,.04)}.stat b{display:block;font-size:1.35rem;color:#111827}.stat span{color:var(--muted);font-weight:800;font-size:12px}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:18px 0}.search{flex:1;min-width:220px;background:#fff;border:1px solid rgba(37,99,235,.14);border-radius:16px;padding:12px 14px;color:var(--text);font-weight:800;box-shadow:0 8px 18px rgba(15,23,42,.04)}.tabs{display:flex;gap:8px}.tab{background:#fff;border:1px solid rgba(37,99,235,.14);border-radius:999px;padding:10px 13px;color:#1d4ed8;font-weight:900;cursor:pointer}.tab.active{background:linear-gradient(135deg,#38bdf8,#2563eb);color:#fff;border:0}.section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:20px 0 12px}.section-head h2{margin:0;font-size:1.35rem;color:#111827;letter-spacing:-.02em}.muted{color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid rgba(37,99,235,.12);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);transition:transform .16s ease,box-shadow .16s ease}.card:hover{transform:translateY(-2px);box-shadow:0 22px 48px rgba(15,23,42,.12)}.thumb{aspect-ratio:16/10;background:#eaf4ff;position:relative}.thumb img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.9);border:1px solid rgba(37,99,235,.16);color:#1d4ed8;font-weight:1000;border-radius:999px;padding:5px 8px;font-size:11px}.body{padding:11px}.card h3{margin:0 0 5px;color:#111827;font-size:13.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:33px}.desc{margin:0 0 10px;color:var(--muted);font-size:12px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:30px}.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.pill{background:rgba(56,189,248,.10);color:#1d4ed8;border:1px solid rgba(56,189,248,.20);border-radius:999px;padding:5px 8px;font-weight:900;font-size:11px}.pill.expired{background:rgba(239,68,68,.08);color:#dc2626;border-color:rgba(239,68,68,.18)}.card .btn{width:100%;padding:9px 8px;font-size:12px;border-radius:12px}.empty,.err{grid-column:1/-1;background:#fff;border:1px solid rgba(37,99,235,.12);border-radius:18px;padding:18px;color:var(--muted);box-shadow:var(--shadow)}.err{color:#dc2626;background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.16);font-weight:800}
    body[data-theme="dark"]{background:#0b1220;color:#f8fafc}body[data-theme="dark"] .brand,body[data-theme="dark"] h1,body[data-theme="dark"] h2,body[data-theme="dark"] .card h3,body[data-theme="dark"] .stat b{color:#f8fafc}body[data-theme="dark"] .muted,body[data-theme="dark"] .hero p,body[data-theme="dark"] .desc,body[data-theme="dark"] .stat span{color:#94a3b8}body[data-theme="dark"] .hero{background:linear-gradient(120deg,rgba(15,23,42,.88),rgba(2,6,23,.96))}body[data-theme="dark"] .card,body[data-theme="dark"] .body,body[data-theme="dark"] .stat,body[data-theme="dark"] .search,body[data-theme="dark"] .tab,body[data-theme="dark"] .user-trigger,body[data-theme="dark"] .user-dropdown,body[data-theme="dark"] .btn.secondary,body[data-theme="dark"] .theme-btn,body[data-theme="dark"] .empty{background:#0f172a;color:#f8fafc;border-color:rgba(148,163,184,.22)}body[data-theme="dark"] .thumb{background:#111827}

    /* Mejora: solo los MANUALES se ven verticales, tipo portada de libro */
    .card.manual-card .thumb{aspect-ratio:3/4;background:linear-gradient(180deg,#f8fbff,#eaf4ff);padding:10px;display:flex;align-items:center;justify-content:center}
    .card.manual-card .thumb img{object-fit:contain;border-radius:9px;box-shadow:0 12px 24px rgba(15,23,42,.16);background:#fff}
    body[data-theme="dark"] .card.manual-card .thumb{background:linear-gradient(180deg,#111827,#0b1220)}
    @media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr);gap:10px}.container{width:min(1180px,94vw)}.user-trigger{max-width:142px}.user-trigger .name{max-width:72px}.btn{padding:9px 10px;font-size:13px}.hero{padding:18px}.stats{min-width:100%;grid-template-columns:repeat(2,1fr)}}
    @media(max-width:520px){.grid{grid-template-columns:repeat(3,1fr);gap:8px}.card{border-radius:14px}.body{padding:8px}.card h3{font-size:11.5px;min-height:29px}.desc{font-size:10.5px;min-height:27px;margin-bottom:8px}.pill{font-size:9px;padding:4px 6px}.badge{font-size:9px;padding:4px 6px}.card .btn{font-size:10px;padding:8px 5px}.thumb{aspect-ratio:1/1}.card.manual-card .thumb{aspect-ratio:3/4;padding:7px}.toolbar{display:block}.search{width:100%;margin-bottom:10px}.tabs{width:100%;justify-content:space-between}.tab{flex:1;padding:9px 8px;font-size:12px}.actions{gap:7px}.btn.secondary[href="index.html"]{display:none}}
  </style>
</head>
<body>
<header class="app-header"><div class="container"><div class="topbar">
  <div class="brand"><span class="dot"></span><span>PASIR<span style="color:#38bdf8"> ESCUELA 🗲</span></span></div>
  <div class="actions">
    <a class="btn secondary" href="account.html">Cursos</a>
    <a class="btn active" href="recursos.html">Recursos</a>
    <a class="btn secondary" href="index.html">Volver</a>
    <button class="theme-btn" id="theme-toggle" type="button" aria-label="Cambiar tema"><span id="theme-icon">☀️</span><span id="theme-label" style="display:none">Modo claro</span></button>
    <div class="user-menu" id="userMenu" style="display:none"><button class="user-trigger" id="userTrigger" aria-haspopup="menu" aria-expanded="false"><span class="avatar">👤</span><span class="name" id="userName">Cuenta</span><span>▾</span></button><div class="user-dropdown" id="userDropdown" role="menu"><div class="dd-email" id="userEmail">Cargando…</div><a class="dd-item" href="account.html">📚 Mis cursos</a><a class="dd-item" href="recursos.html">📥 Manuales y Apps</a><a class="dd-item" href="index.html">🏠 Inicio</a><div class="dd-sep"></div><button class="dd-item danger" id="logout">🚪 Cerrar sesión</button></div></div>
  </div>
</div></div></header>
<main><div class="container">
  <section class="hero"><div><div class="eyebrow">📥 Biblioteca premium</div><h1>Manuales y Apps</h1><p>Todo lo que tienes habilitado, organizado para descargar rápido.</p></div><div class="stats"><div class="stat"><b id="manualStat">0</b><span>Manuales</span></div><div class="stat"><b id="appStat">0</b><span>Apps</span></div></div></section>
  <div id="status" class="muted">Cargando…</div>
  <div class="toolbar"><input class="search" id="searchBox" placeholder="Buscar manual o app..." autocomplete="off"><div class="tabs"><button class="tab active" data-filter="all">Todo</button><button class="tab" data-filter="manual">Manuales</button><button class="tab" data-filter="app">Apps</button></div></div>
  <section class="section"><div class="section-head"><h2 id="sectionTitle">Todos los recursos</h2><span class="muted" id="resourceCount"></span></div><div id="grid" class="grid"></div></section>
</div></main>
<script>
const API_URL="https://pasir-proxy.vercel.app/api";const token=localStorage.getItem("pasir_token");if(!token)location.replace("login.html");let allResources=[];let currentFilter="all";
function escapeHtml_(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function jsonp(action,payload){return new Promise((resolve,reject)=>{const cb="cb_"+Math.random().toString(36).slice(2);const params=new URLSearchParams();params.set("action",action);Object.entries(payload||{}).forEach(([k,v])=>{if(v!==undefined&&v!==null)params.set(k,String(v));});params.set("callback",cb);const script=document.createElement("script");script.src=API_URL+"?"+params.toString();script.async=true;window[cb]=data=>{cleanup();resolve(data)};function cleanup(){try{delete window[cb]}catch(e){window[cb]=undefined}if(script.parentNode)script.parentNode.removeChild(script)}script.onerror=()=>{cleanup();reject(new Error("Sin conexión a internet."));};document.body.appendChild(script);});}
function normalizeType(t){t=String(t||"").trim().toLowerCase();return(t.includes("app")||t.includes("software"))?"app":"manual";}
function shortEmail(email){email=String(email||"");return email.includes("@")?email.split("@")[0]:email;}
function titleCaseName(name){return String(name||"").trim().replace(/\s+/g," ").split(" ").filter(Boolean).slice(0,2).map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(" ");}
function getDisplayName(profile){
  const email=typeof profile==="object"?(profile.email||""):String(profile||"");
  const rawName=typeof profile==="object"?(profile.name||profile.fullName||profile.displayName||profile.nombre||profile.nombres||profile.studentName||profile.usuario||""):(!String(profile||"").includes("@")?profile:"");
  const savedName=localStorage.getItem("pasir_name")||"";
  return titleCaseName(rawName)||titleCaseName(savedName)||shortEmail(email);
}
function setUser(profile){
  const email=typeof profile==="object"?(profile.email||""):String(profile||"");
  const displayName=getDisplayName(profile);
  if(email)localStorage.setItem("pasir_email",email);
  if(displayName && displayName!==shortEmail(email))localStorage.setItem("pasir_name",displayName);
  document.getElementById("userName").textContent=displayName||"Cuenta";
  document.getElementById("userEmail").textContent=email||displayName||"Cuenta";
  document.getElementById("userMenu").style.display="inline-block";
}

function card(r){
  const type=normalizeType(r.type);
  const img=r.image||(type==="app"?"img/app_logicsoft.jpg":"img/manual_industrial.jpg");
  const expired=!!r.expired;
  const statusText=expired?"Vencido":"Activo";

  return `
  <article class="card ${type==="manual"?"manual-card":""}"
    data-link="${escapeHtml_(r.link)}"
    data-title="${escapeHtml_(r.title)}"
    data-desc="${escapeHtml_(r.description||"")}"
    data-img="${escapeHtml_(img)}"
    data-type="${type}"
    style="cursor:pointer">

    <div class="thumb">
      <img src="${escapeHtml_(img)}">
      <span class="badge">${type==="app"?"APP":"MANUAL"}</span>
    </div>

    <div class="body">
      <h3>${escapeHtml_(r.title)}</h3>
      <p class="desc">${escapeHtml_(r.description||"Recurso disponible para tu cuenta.")}</p>

      <div class="meta">
        <span class="pill ${expired?"expired":""}">${statusText}</span>
      </div>
    </div>
  </article>`;
}
function render(){const q=document.getElementById("searchBox").value.trim().toLowerCase();let items=allResources.filter(r=>currentFilter==="all"||normalizeType(r.type)===currentFilter);if(q)items=items.filter(r=>(String(r.title||"")+" "+String(r.description||"")).toLowerCase().includes(q));document.getElementById("sectionTitle").textContent=currentFilter==="manual"?"Manuales":currentFilter==="app"?"Apps":"Todos los recursos";document.getElementById("resourceCount").textContent=items.length?items.length+" recurso(s)":"";document.getElementById("grid").innerHTML=items.length?items.map(card).join(""):`<div class="empty">No hay recursos para mostrar.</div>`;}
(async function(){try{const r=await jsonp("myResources",{token});if(!r.ok){localStorage.removeItem("pasir_token");return location.replace("login.html");}setUser({email:r.email||localStorage.getItem("pasir_email")||"",name:r.name||r.fullName||r.displayName||r.nombre||r.nombres||r.studentName||r.usuario||localStorage.getItem("pasir_name")||""});allResources=Array.isArray(r.resources)?r.resources:[];const manuals=allResources.filter(x=>normalizeType(x.type)==="manual");const apps=allResources.filter(x=>normalizeType(x.type)==="app");document.getElementById("manualStat").textContent=manuals.length;document.getElementById("appStat").textContent=apps.length;document.getElementById("status").textContent="";render();}catch(e){document.getElementById("status").innerHTML='<div class="err">'+escapeHtml_(e.message||e)+'</div>';}})();
document.getElementById("searchBox").addEventListener("input",render);document.querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active"));btn.classList.add("active");currentFilter=btn.dataset.filter;render();}));
(function(){const userTrigger=document.getElementById("userTrigger"),userDropdown=document.getElementById("userDropdown");const storedEmail=localStorage.getItem("pasir_email")||"";const storedName=localStorage.getItem("pasir_name")||"";if(storedEmail||storedName)setUser({email:storedEmail,name:storedName});function closeMenu(){userDropdown&&userDropdown.classList.remove("open");userTrigger&&userTrigger.setAttribute("aria-expanded","false");}if(userTrigger&&userDropdown){userTrigger.addEventListener("click",e=>{e.stopPropagation();userDropdown.classList.toggle("open");userTrigger.setAttribute("aria-expanded",userDropdown.classList.contains("open")?"true":"false");});document.addEventListener("click",closeMenu);document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu();});userDropdown.addEventListener("click",e=>e.stopPropagation());}const logoutBtn=document.getElementById("logout");if(logoutBtn)logoutBtn.addEventListener("click",e=>{e.preventDefault();localStorage.removeItem("pasir_token");localStorage.removeItem("pasir_name");localStorage.removeItem("pasir_email");location.replace("index.html");});})();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
</script>

<!-- PREVIEW MODAL -->
<div id="previewModal" style="
position:fixed;inset:0;
background:rgba(0,0,0,.75);
display:none;
align-items:center;
justify-content:center;
z-index:9999">

  <div style="width:min(900px,95vw);background:#fff;border-radius:18px;overflow:hidden">
    <img id="pvImg" style="width:100%;max-height:320px;object-fit:cover">
    <div style="padding:16px">
      <h2 id="pvTitle"></h2>
      <p id="pvDesc" style="color:#666"></p>

      <div style="display:flex;gap:10px;margin-top:15px">
        <button onclick="closePV()" style="flex:1;padding:12px;border:none;border-radius:10px;background:#ddd;font-weight:700">Cerrar</button>
        <a id="pvOpen" target="_blank" style="flex:1;padding:12px;text-align:center;border-radius:10px;background:#2563eb;color:#fff;text-decoration:none;font-weight:700">Abrir</a>
      </div>
    </div>
  </div>
</div>
<script>
document.addEventListener("click",(e)=>{
  const card=e.target.closest(".card");
  if(!card) return;

  if(card.dataset.link){
    document.getElementById('previewModal').style.display='flex';
    document.getElementById('pvImg').src=card.dataset.img;
    document.getElementById('pvTitle').textContent=card.dataset.title;
    document.getElementById('pvDesc').textContent=card.dataset.desc;
    document.getElementById('pvOpen').href=card.dataset.link;
    localStorage.setItem('last_resource',card.dataset.link);
  }
});

function closePV(){
  document.getElementById('previewModal').style.display='none';
}

function openLast(){
  const last=localStorage.getItem('last_resource');
  if(last) window.open(last,'_blank');
}
</script></body>
</html>
